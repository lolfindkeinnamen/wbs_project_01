<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halloween</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 overflow-hidden bg-black">

  <div id="scene" class="fixed inset-0 cursor-pointer">
    <img src="ressources_body_2/castle.png" alt="" class="absolute inset-0 h-full w-full object-cover" />
    <img id="scare" src="ressources_body_2/the-nun-2-4k-q9-3440x1440.jpg" alt="" class="pointer-events-none absolute inset-0 h-full w-full object-cover opacity-0" />

    <h1 class="pointer-events-none absolute inset-x-0 top-10 z-10 text-center text-4xl font-bold text-white drop-shadow-lg">
      Or Click on our Castle
    </h1>
  </div>
  <audio id="scream" src="ressources_body_2/horror-scream-high-quality.mp3" preload="auto"></audio>

  <script>
    const scene = document.getElementById('scene');
    const scare = document.getElementById('scare');

    scene.addEventListener('click', () => {
        const scream = document.getElementById('scream');
        scream.currentTime = 0;
        scream.play();

      const hard = 'steps(1, end)';
      scare.animate(
        [
          { opacity: 0,   easing: hard },
          { opacity: 0.5, easing: hard, offset: 0.1 },
          { opacity: 0,   easing: hard, offset: 0.25 },
          { opacity: 0.5, easing: hard, offset: 0.4 },
          { opacity: 0,   easing: hard, offset: 0.55 },
          { opacity: 0.5, easing: hard, offset: 0.7 },
          { opacity: 0.5 },
        ],
        { duration: 1200, fill: 'forwards' }
      );
    });

    // Escape hides the scare again for the next person
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            scare.getAnimations().forEach((a) => a.cancel());
            const scream = document.getElementById('scream');
            scream.pause();
            scream.currentTime = 0;
        }
        if (e.key === 'Escape') scare.getAnimations().forEach((a) => a.cancel());
        if (e.key === 'Escape') {
            window.location.href = 'index.html';
        }
    });
  </script>
</body>
</html>
